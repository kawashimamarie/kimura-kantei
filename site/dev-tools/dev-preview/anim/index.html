<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>動きの比較（開発用・非公開）</title>
<style>
:root{--g:#2B5357;--bg:#FBF9F5;--a:#7A5D38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1F2426;font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
header{padding:10px 14px;background:var(--g);color:#fff}header h1{margin:0;font-size:15px}header p{margin:2px 0 0;font-size:11.5px;opacity:.9}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid #ddd6ca;padding:8px 10px;display:grid;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row b{font-size:12px;color:#545B5E;min-width:3em}
button{min-height:44px;padding:0 12px;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button[aria-pressed=true]{background:var(--g);color:#fff}button.go{background:var(--a);border-color:var(--a);color:#fff}button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
#stage{padding:8px 10px}#frame{display:block;width:100%;max-width:430px;margin:0 auto;height:66vh;border:1px solid #ccc;background:#fff;border-radius:8px}
#info{font-size:12px;color:#545B5E;padding:0 12px 6px;max-width:430px;margin:0 auto}#warn{font-size:12px;color:#8a3b00;padding:0 12px 20px;max-width:430px;margin:0 auto}
</style></head><body>
<header><h1>動きの比較（開発・確認用）</h1><p>実際のサイトの動きを使っています。確認用サイトにだけあり、本番には含まれません（noindex）。</p></header>
<div class="bar" role="group" aria-label="操作">
 <div class="row"><b>場面</b><button data-s="fv" aria-pressed="true">ファーストビュー</button><button data-s="svc" aria-pressed="false">サービス6件</button><button data-s="exp" aria-pressed="false">専門性</button><button data-s="low" aria-pressed="false">下層ページ</button></div>
 <div class="row"><b>動き</b><button data-p="new" aria-pressed="true">新（約0.65秒）</button><button data-p="old" aria-pressed="false">修正前（約0.38秒）</button></div>
 <div class="row"><b>速さ</b><button data-r="1" aria-pressed="true">実速度</button><button data-r=".5" aria-pressed="false">1/2</button><button data-r=".25" aria-pressed="false">1/4</button><button data-r=".1" aria-pressed="false">1/10</button></div>
 <div class="row"><button class="go" id="play">▶ 再生（最初から）</button><button id="pause">⏸ 一時停止</button><button id="resume">▶ 再開</button></div>
</div>
<div id="stage"><iframe id="frame" title="確認対象のページ"></iframe></div>
<p id="info" aria-live="polite"></p><p id="warn" hidden>この端末は「動きを減らす」設定が ON です。サイトの動きは止まって見えます（設定を OFF にしてください）。</p>
<script>
(function(){
var BASE=location.pathname.replace(/dev-preview\/.*$/,'');
var PRESET={new:{'--an-dur':'.65s','--an-ease':'cubic-bezier(.2,.6,.2,1)','--an-dist':'8px','--an-reveal-dist':'10px','--an-step':'.06s'},
            old:{'--an-dur':'.38s','--an-ease':'cubic-bezier(.22,.7,.2,1)','--an-dist':'8px','--an-reveal-dist':'10px','--an-step':'.05s'}};
var SCENES={fv:{url:BASE,sel:null,scope:'.c2-fv, .c2-sign, .c2-pick',desc:'ページを開いたときの、ファーストビューの順次表示'},
 svc:{url:BASE,sel:'.c2-pick',scope:'.c2-pick',desc:'相談内容の6つのタイル（アイコン）'},
 exp:{url:BASE,sel:'.hb',scope:'.hb',desc:'専門性セクション（スクロールで現れる）'},
 low:{url:BASE+'services/inheritance/',sel:null,scope:'.lhero, .split__head',desc:'下層ページの見出し・導入文'}};
var scene='fv',rate=1,preset='new',f=document.getElementById('frame'),info=document.getElementById('info');
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('warn').hidden=false;
function doc(){return f.contentDocument}function win(){return f.contentWindow}
function inScope(a){var t=a.effect&&a.effect.target;return !!(t&&t.closest&&t.closest(SCENES[scene].scope))}
function scoped(){return doc().getAnimations().filter(inScope)}
function applyPreset(){var r=doc().documentElement.style,p=PRESET[preset];for(var k in p)r.setProperty(k,p[k])}
function replay(){var d=doc(),w=win(),s=SCENES[scene];d.documentElement.classList.add('js','anim-go');applyPreset();
  var tmp=d.createElement('style');tmp.textContent='.reveal,.reveal *{transition:none!important}';d.head.appendChild(tmp);
  d.querySelectorAll('.reveal.is-in').forEach(function(e){e.classList.remove('is-in')});
  if(s.sel){var t=d.querySelector(s.sel);if(t)t.scrollIntoView({block:'center'})}else w.scrollTo(0,0);
  void d.body.offsetHeight;tmp.remove();void d.body.offsetHeight;
  d.getAnimations().filter(function(a){return a.animationName&&inScope(a)}).forEach(function(a){a.cancel();a.playbackRate=rate;a.play()});
  requestAnimationFrame(function(){d.querySelectorAll('.reveal').forEach(function(e){var r=e.getBoundingClientRect();if(r.top<w.innerHeight&&r.bottom>0)e.classList.add('is-in')});
    scoped().forEach(function(a){a.playbackRate=rate});
    info.textContent=s.desc+' ／ '+(preset==='new'?'新（約0.65秒）':'修正前（約0.38秒）')+' ／ 速さ '+(rate===1?'実速度':rate+'倍')+' ／ 動いている要素 '+scoped().length+' 件'})}
function load(){f.onload=function(){setTimeout(replay,60)};f.src=SCENES[scene].url}
function press(sel,on){document.querySelectorAll(sel).forEach(function(b){b.setAttribute('aria-pressed',b===on)})}
document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){scene=b.dataset.s;press('[data-s]',b);load()}});
document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){preset=b.dataset.p;press('[data-p]',b);replay()}});
document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){rate=+b.dataset.r;press('[data-r]',b);replay()}});
document.getElementById('play').onclick=replay;
document.getElementById('pause').onclick=function(){scoped().forEach(function(a){a.pause()})};
document.getElementById('resume').onclick=function(){scoped().forEach(function(a){a.play()})};
load();
})();
</script></body></html>
