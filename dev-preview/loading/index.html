<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>ローディングの比較（開発用・非公開）</title>
<style>
:root{--g:#2B5357;--bg:#FBF9F5;--a:#7A5D38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1F2426;font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
header{padding:10px 14px;background:var(--g);color:#fff}header h1{margin:0;font-size:15px}header p{margin:2px 0 0;font-size:11.5px;opacity:.9}
.bar{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid #ddd6ca;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap}
button{min-height:44px;padding:0 14px;border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button[aria-pressed=true]{background:var(--g);color:#fff}button.go{background:var(--a);border-color:var(--a);color:#fff}button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
#grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:12px}
.col{width:var(--w)}.col h2{margin:0 0 2px;font-size:14px}.col p.d{margin:0 0 6px;font-size:12px;color:#545B5E}
.phone{position:relative;overflow:hidden;width:390px;height:680px;border:1px solid #bbb;border-radius:18px;background:#fff;transform-origin:top left}
.phone iframe{border:0;width:390px;height:680px;display:block}
.ld{position:absolute;inset:0;z-index:5;background:#FBF9F5;display:none;place-items:center;pointer-events:none}
.ld img{width:min(52vw,200px);height:auto}
.ld.on{display:grid}
/* B：ロゴを0.7秒表示 → 0.25秒で消える */
.ld.b.run{animation:ldo-b .25s ease-out .7s forwards}
@keyframes ldo-b{to{opacity:0;visibility:hidden}}
/* C：ロゴが0.3秒でフェードイン → 0.45秒保持 → 0.6秒でロゴと一緒にゆっくり消える */
.ld.c.run{animation:ldo-c .6s ease-out .45s forwards}.ld.c img{opacity:0}.ld.c.run img{animation:ldi-c .3s ease-out .05s forwards,ldz-c .6s ease-out .45s forwards}
@keyframes ldi-c{to{opacity:1}}@keyframes ldz-c{to{opacity:0;transform:translateY(-6px)}}@keyframes ldo-c{to{opacity:0;visibility:hidden}}
.t{font-size:12.5px;margin:6px 0 0;color:#1F2426;min-height:1.6em}
.spec{max-width:1200px;margin:6px auto 0;padding:0 14px 28px;font-size:13px;color:#545B5E}.spec table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}.spec td,.spec th{border:1px solid #ddd6ca;padding:4px 6px;text-align:left}
.tabs{display:none}@media (max-width:760px){.tabs{display:flex}.col:not(.cur){display:none}}
</style></head><body>
<header><h1>ローディングの比較（開発・確認用）</h1><p>本サイトには未実装です。比較のための表示だけです。確認用サイトにだけあり、本番には含まれません（noindex）。</p></header>
<div class="bar" role="group" aria-label="操作"><button class="go" id="playall">▶ 3案を同時に再生</button><span class="tabs" id="tabs"><button data-c="a" aria-pressed="true">A</button><button data-c="b" aria-pressed="false">B</button><button data-c="c" aria-pressed="false">C</button></span></div>
<div id="grid"></div>
<div class="spec" id="spec"></div>
<script>
(function(){
var BASE=location.pathname.replace(/dev-preview\/.*$/,'');
var VARS=[{k:'a',t:'A：ローディングなし（現状）',d:'ページを開くと、すぐ本文が表示されます。'},
{k:'b',t:'B：ロゴを短時間表示',d:'ロゴを約0.7秒表示してから、0.25秒で本文へ（合計約0.95秒）。'},
{k:'c',t:'C：ロゴ＋控えめなフェード',d:'ロゴが0.3秒で現れ、0.45秒保持して、0.6秒かけてゆっくり本文へ（合計約1.05秒）。'}];
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var grid=document.getElementById('grid'),cols={};
var W=Math.min(390,innerWidth-24),S=W/390;
VARS.forEach(function(v){var c=document.createElement('div');c.className='col'+(v.k==='a'?' cur':'');c.style.setProperty('--w',W+'px');
 c.innerHTML='<h2>'+v.t+'</h2><p class="d">'+v.d+'</p><div style="height:'+(680*S)+'px"><div class="phone" style="transform:scale('+S+')"><iframe title="'+v.t+'"></iframe><div class="ld '+v.k+'" aria-hidden="true"><img alt="" src="'+BASE+'assets/img/logo/kimura-logo.png" width="240" height="80"></div></div></div><p class="t" aria-live="polite"></p><button data-play="'+v.k+'">▶ 再生</button>';
 grid.appendChild(c);cols[v.k]={el:c,f:c.querySelector('iframe'),ld:c.querySelector('.ld'),t:c.querySelector('.t')}});
function play(k){var o=cols[k],t0=performance.now();o.t.textContent='読み込み中…';
 o.ld.classList.remove('run','on');void o.ld.offsetWidth;
 if(k!=='a'&&!reduce){o.ld.classList.add('on');void o.ld.offsetWidth;o.ld.classList.add('run');
  o.ld.onanimationend=function(e){if(e.target===o.ld)o.t.textContent='本文が見えるまで 約'+Math.round(performance.now()-t0)+'ms（ロゴ表示を含む）'}}
 if(k!=='a'&&reduce)o.t.textContent='「動きを減らす」設定が ON のため、ロゴは表示せず本文をすぐ表示します（実際の実装でも同じ扱い）';
 o.f.onload=function(){if(k==='a')o.t.textContent='ページが表示されるまで 約'+Math.round(performance.now()-t0)+'ms';};
 o.f.src=BASE+'?r='+Date.now()}
document.querySelectorAll('[data-play]').forEach(function(b){b.onclick=function(){play(b.dataset.play)}});
document.getElementById('playall').onclick=function(){Object.keys(cols).forEach(play)};
document.querySelectorAll('#tabs [data-c]').forEach(function(b){b.onclick=function(){Object.keys(cols).forEach(function(k){cols[k].el.classList.toggle('cur',k===b.dataset.c)});document.querySelectorAll('#tabs [data-c]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
document.getElementById('spec').innerHTML='<p><b>測定（試作・Chromium・トップページ・各7回の中央値・通信10Mbps/RTT60ms）</b></p><table><tr><th>条件</th><th>案</th><th>FCP</th><th>LCP</th><th>CLS</th><th>本文が見え始める</th></tr>'+
'<tr><td>スマホ・CPU4倍</td><td>A / B / C</td><td>1088 / 212 / 1040ms</td><td>1088 / 212 / 1600ms</td><td>0 / 0.0008 / 0.0008</td><td>1088 / 1172 / 1131ms</td></tr>'+
'<tr><td>スマホ・制限なし</td><td>A / B / C</td><td>404 / 180 / 352ms</td><td>404 / 180 / 592ms</td><td>0 / 0 / 0</td><td>404 / 1085 / 1286ms</td></tr>'+
'<tr><td>PC・制限なし</td><td>A / B / C</td><td>436 / 168 / 388ms</td><td>436 / 168 / 620ms</td><td>0.0013 / 0.0013 / 0.0013</td><td>436 / 1065 / 1299ms</td></tr></table>'+
'<p>B・C はロゴが先に描かれるので FCP が小さく出ますが、本文が読めるのは A より約0.7〜0.9秒遅くなります。CSS だけで消えるため、JS が動かなくても本文を隠し続けません。</p>';
Object.keys(cols).forEach(play);
})();
</script></body></html>
